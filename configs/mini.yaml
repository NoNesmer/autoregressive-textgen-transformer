# Mini model configuration for quick sanity checks
# vocab_size is read dynamically from vocab.json at runtime

block_size: 128
batch_size: 64
subset_size: 100000

d_model: 64
n_heads: 2
n_layers: 1
dropout: 0.0

seed: 42

learning_rate: 3e-4
weight_decay: 0.0
epochs: 3
patience: 3

run_name: "mini"
